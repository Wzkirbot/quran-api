<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Playground - Quran API</title>
  <meta name="description" content="Interactive developer playground to test and execute local Quran API endpoints directly.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
</head>
<body>
  <div class="bg-glow"></div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="brand">
        <div class="brand-icon">📖</div>
        <span>Quran API</span>
      </a>
      <ul class="nav-links">
        <li><a href="/" class="nav-link">Home</a></li>
        <li><a href="/docs" class="nav-link">Documentation</a></li>
        <li><a href="/playground" class="nav-link active">Playground</a></li>
        <li><a href="/status" class="nav-link">Status</a></li>
      </ul>
    </div>
  </header>

  <main class="playground-container">
    <!-- Controls Sidebar -->
    <div class="control-panel">
      <h2 style="font-size: 1.25rem; font-weight: 700;">API Request Studio</h2>

      <div class="form-group">
        <label for="endpoint-select" class="form-label">Predefined Endpoint</label>
        <select id="endpoint-select" class="form-select">
          <optgroup label="Ayahs & Surahs">
            <option value="/v1/ayahs/2:255">GET /v1/ayahs/2:255 (Ayat Al-Kursi)</option>
            <option value="/v1/ayahs/random">GET /v1/ayahs/random (Random Ayah)</option>
            <option value="/v1/surahs">GET /v1/surahs (All 114 Surahs)</option>
            <option value="/v1/surahs/1">GET /v1/surahs/1 (Al-Fatihah)</option>
            <option value="/v1/surahs/1/ayahs">GET /v1/surahs/1/ayahs (Ayahs of Al-Fatihah)</option>
            <option value="/v1/surahs/112/ayahs">GET /v1/surahs/112/ayahs (Al-Ikhlas)</option>
          </optgroup>
          <optgroup label="Search & Sections">
            <option value="/v1/search?q=الصلاة">GET /v1/search?q=الصلاة (Search Prayer)</option>
            <option value="/v1/search?q=الجنة">GET /v1/search?q=الجنة (Search Paradise)</option>
            <option value="/v1/juz/1">GET /v1/juz/1 (First Juz)</option>
            <option value="/v1/pages/1">GET /v1/pages/1 (Page 1 of Madinah Mushaf)</option>
            <option value="/v1/pages/604">GET /v1/pages/604 (Page 604)</option>
          </optgroup>
          <optgroup label="Adhkar & Duas">
            <option value="/v1/adhkar/categories">GET /v1/adhkar/categories (All Categories)</option>
            <option value="/v1/adhkar/category/morning">GET /v1/adhkar/category/morning (Morning Adhkar)</option>
            <option value="/v1/adhkar/category/evening">GET /v1/adhkar/category/evening (Evening Adhkar)</option>
            <option value="/v1/adhkar/random">GET /v1/adhkar/random (Random Dhikr)</option>
            <option value="/v1/adhkar/duas">GET /v1/adhkar/duas (Quranic & Prophetic Duas)</option>
          </optgroup>
          <optgroup label="Tafsir & Translations">
            <option value="/v1/tafsir/1/1">GET /v1/tafsir/1/1 (Al-Muyassar Tafsir)</option>
            <option value="/v1/translations/1/1">GET /v1/translations/1/1 (English Translation)</option>
          </optgroup>
          <optgroup label="System Diagnostics">
            <option value="/health">GET /health</option>
            <option value="/ready">GET /ready</option>
            <option value="/version">GET /version</option>
          </optgroup>
        </select>
      </div>

      <div class="form-group">
        <label for="custom-path-input" class="form-label">Custom Request Path</label>
        <input type="text" id="custom-path-input" class="form-input" value="/v1/ayahs/2:255">
      </div>

      <button id="send-request-btn" class="btn btn-primary" style="justify-content: center; width: 100%;">
        <span>🚀 Send Request</span>
      </button>

      <div class="form-group" style="margin-top: 1rem;">
        <label class="form-label">Generated cURL</label>
        <div class="code-block" id="curl-preview" style="font-size: 0.8rem; word-break: break-all;">
          curl "http://localhost:3000/v1/ayahs/2:255"
        </div>
      </div>
    </div>

    <!-- Results Panel -->
    <div class="result-panel">
      <div class="result-header">
        <div class="result-status">
          <span id="status-badge" class="badge-status badge-200">200 OK</span>
          <span id="latency-badge" class="badge-latency">Latency: -- ms</span>
        </div>
        <button id="copy-json-btn" class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">
          📋 Copy JSON
        </button>
      </div>
      <div class="result-content">
        <pre class="json-viewer" id="json-output">// Click "Send Request" to execute query...</pre>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>Quran API Playground — Direct, Offline, Local REST Endpoint Testing</p>
  </footer>

  <script src="/js/playground.js"></script>
</body>
</html>
