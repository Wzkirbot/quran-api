name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Lint, Validate & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: 1. Strict TypeScript Typecheck
        run: npm run typecheck

      - name: 2. Validate Dataset Integrity (114 Surahs, 6236 Ayahs, Checksums)
        run: npm run validate:data

      - name: 3. Offline Guardrail Audit (Zero External Quran API calls)
        run: npm run guard:offline

      - name: 4. Build Production Bundle
        run: npm run build
